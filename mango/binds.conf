bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ && play /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05- && play /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bind=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl --class=backlight set +5%
bind=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl --class=backlight set 5%-

